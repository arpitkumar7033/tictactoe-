<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tic Tac Toe</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<h1>Tic Tac Toe</h1>


<button id="themeBtn">
🌙 Dark Mode
</button>

<button id="soundBtn">
🔊 Sound ON
</button>



<!-- Score Board -->

<div class="scoreBoard">

<div>
<h3>X</h3>
<span id="xScore">0</span>
</div>


<div>
<h3>Draw</h3>
<span id="drawScore">0</span>
</div>


<div>
<h3>O</h3>
<span id="oScore">0</span>
</div>

</div>





<!-- Menu -->

<div id="menu">


<h2>Select Mode</h2>

<div class="player-input">

<input id="playerX" 
placeholder="Player X Name"
value=" playerX ">

<input id="playerO" 
placeholder="Player O Name"
value=" playerO ">

</div>

<button id="friendBtn">
👥 Play With Friend
</button>


<button id="computerBtn">
🤖 Play With Computer
</button>



<h2>Difficulty</h2>


<button id="easy">
Easy
</button>


<button id="medium">
Medium
</button>


<button id="hard">
Hard
</button>



</div>







<!-- Game -->

<div id="game">


<h2 id="status">
Player X Turn
</h2>



<div class="board">


<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>


<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>


<div class="cell"></div>
<div class="cell"></div>
<div class="cell"></div>


</div>



<button id="restart">
Restart
</button>


</div>








<!-- Result Popup -->

<div id="resultScreen">


<div class="resultBox">


<h1 id="resultText">
X Wins! 🏆

<p id="streak"></p>

</h1>


<button id="playAgain">
🔄 Play Again
</button>


<button id="backMenu">
🏠 Main Menu
</button>


</div>


</div>





<script src="script.js"></script>


</body>

</html>
